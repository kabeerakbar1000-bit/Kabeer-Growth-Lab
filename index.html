<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kabeer Growth Lab — Digital Marketing Agency</title>
  <style>
    /* BASE STYLES */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: auto; overflow-y: auto; scroll-behavior: smooth; }
    body { font-family: sans-serif; background-color: #080C14; color: #E8EDF5; height: auto; overflow-y: auto; }
    
    /* CONTACT SECTION FIX */
    #contact { padding: 100px 0; }
    .contact-wrap { background: #0F1622; border-radius: 24px; display: grid; grid-template-columns: 1fr 1fr; overflow: hidden; }
    .contact-left { padding: 50px; background: #0A1520; }
    .contact-left-title { font-size: 1.8rem; font-weight: 800; margin-bottom: 20px; }
    .contact-left-title span { color: #3EE8B5; }
    .contact-left-desc { font-size: 0.95rem; color: #7B8FA8; margin-bottom: 30px; }
    .contact-info-item { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
    .contact-info-icon { width: 40px; height: 40px; border-radius: 10px; background: rgba(62, 232, 181, 0.1); display: grid; place-items: center; }
    .contact-right { padding: 50px; }
    
    /* ADDED THIS TO ENSURE IT DISPLAYS */
    .contact-form { display: flex; flex-direction: column; gap: 15px; }
    input, textarea { padding: 15px; border-radius: 8px; border: 1px solid #333; background: #131C2E; color: white; }
    button { padding: 15px; background: #3EE8B5; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

<section id="contact">
  <div class="contact-wrap">
    <div class="contact-left">
      <h2 class="contact-left-title">Let's <span>Scale</span> Your Business</h2>
      <p class="contact-left-desc">Ready to grow? Send us a message and we'll get back to you.</p>
      <div class="contact-info-item">
        <div class="contact-info-icon">📧</div>
        <div>hello@kabeergrowthlab.com</div>
      </div>
    </div>
    <div class="contact-right">
      <form class="contact-form">
        <input type="text" placeholder="Your Name" required>
        <input type="email" placeholder="Your Email" required>
        <textarea placeholder="Your Message" rows="5"></textarea>
        <button type="submit">Send Message</button>
      </form>
    </div>
  </div>
</section>

</body>
</html>
