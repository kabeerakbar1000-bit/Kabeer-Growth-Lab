<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kabeer Growth Lab — Digital Marketing Agency</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* =============================================
       RESET & BASE
    ============================================= */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      height: auto;
      overflow-y: auto;
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #080C14;
      color: #E8EDF5;
      height: auto;
      overflow-y: auto;
      -webkit-font-smoothing: antialiased;
    }

    /* =============================================
       CSS VARIABLES
    ============================================= */
    :root {
      --accent: #3EE8B5;
      --accent-dim: rgba(62, 232, 181, 0.12);
      --accent-glow: rgba(62, 232, 181, 0.35);
      --bg-deep: #080C14;
      --bg-card: #0F1622;
      --bg-card2: #131C2E;
      --text-primary: #E8EDF5;
      --text-muted: #7B8FA8;
      --border: rgba(255,255,255,0.07);
      --nav-height: 72px;
      --radius: 16px;
      --radius-sm: 10px;
    }

    /* =============================================
       NAVBAR
    ============================================= */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      height: var(--nav-height);
      display: flex;
      align-items: center;
      padding: 0 5%;
      background: rgba(8, 12, 20, 0.75);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border);
      transition: background 0.3s ease;
    }

    .nav-inner {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .nav-logo-mark {
      width: 36px;
      height: 36px;
      background: var(--accent);
      border-radius: 8px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .nav-logo-mark svg {
      width: 20px;
      height: 20px;
    }

    .nav-logo-text {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.2;
    }

    .nav-logo-text span {
      color: var(--accent);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 36px;
      list-style: none;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 500;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: var(--text-primary);
    }

    .nav-cta {
      background: var(--accent);
      color: #080C14 !important;
      padding: 10px 22px;
      border-radius: 50px;
      font-weight: 700 !important;
      font-size: 0.875rem !important;
      transition: opacity 0.2s, transform 0.2s !important;
    }

    .nav-cta:hover {
      opacity: 0.88;
      transform: translateY(-1px);
    }

    /* Hamburger */
    .hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      background: none;
      border: none;
      padding: 4px;
      z-index: 1100;
    }

    .hamburger span {
      display: block;
      width: 24px;
      height: 2px;
      background: var(--text-primary);
      border-radius: 2px;
      transition: transform 0.3s ease, opacity 0.3s ease;
      transform-origin: center;
    }

    .hamburger.open span:nth-child(1) {
      transform: translateY(7px) rotate(45deg);
    }

    .hamburger.open span:nth-child(2) {
      opacity: 0;
    }

    .hamburger.open span:nth-child(3) {
      transform: translateY(-7px) rotate(-45deg);
    }

    /* Mobile menu */
    .mobile-menu {
      display: none;
      position: fixed;
      top: var(--nav-height);
      left: 0;
      right: 0;
      background: rgba(8, 12, 20, 0.97);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border);
      z-index: 999;
      padding: 28px 6%;
      flex-direction: column;
      gap: 20px;
      transform: translateY(-10px);
      opacity: 0;
      transition: transform 0.3s ease, opacity 0.3s ease;
      pointer-events: none;
    }

    .mobile-menu.open {
      display: flex;
      transform: translateY(0);
      opacity: 1;
      pointer-events: all;
    }

    .mobile-menu a {
      text-decoration: none;
      color: var(--text-primary);
      font-size: 1.1rem;
      font-weight: 600;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      transition: color 0.2s;
    }

    .mobile-menu a:last-child {
      border-bottom: none;
      color: var(--accent);
    }

    /* =============================================
       SHARED SECTION STYLES
    ============================================= */
    section {
      width: 100%;
      overflow: visible;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 5%;
    }

    .section-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--accent-dim);
      border: 1px solid rgba(62, 232, 181, 0.25);
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 50px;
      margin-bottom: 20px;
    }

    .section-title {
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 800;
      line-height: 1.15;
      color: var(--text-primary);
      margin-bottom: 16px;
    }

    .section-title span {
      color: var(--accent);
    }

    .section-subtitle {
      font-size: 1.05rem;
      color: var(--text-muted);
      line-height: 1.7;
      max-width: 560px;
    }

    /* =============================================
       HERO SECTION
    ============================================= */
    #hero {
      min-height: 100vh;
      overflow: visible;
      display: flex;
      align-items: center;
      position: relative;
      padding-top: var(--nav-height);
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .hero-glow-1 {
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(62, 232, 181, 0.13) 0%, transparent 70%);
      top: -100px;
      right: -100px;
      animation: floatGlow 8s ease-in-out infinite alternate;
    }

    .hero-glow-2 {
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(62, 130, 232, 0.1) 0%, transparent 70%);
      bottom: 50px;
      left: -80px;
      animation: floatGlow 10s ease-in-out infinite alternate-reverse;
    }

    .hero-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse at center, rgba(0,0,0,0.5) 0%, transparent 75%);
    }

    @keyframes floatGlow {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(30px, 20px) scale(1.08); }
    }

    .hero-content {
      position: relative;
      z-index: 1;
      width: 100%;
      padding: 80px 0 100px;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--accent-dim);
      border: 1px solid rgba(62, 232, 181, 0.3);
      color: var(--accent);
      font-size: 0.82rem;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 50px;
      margin-bottom: 28px;
      animation: fadeUp 0.6s ease both;
    }

    .hero-badge-dot {
      width: 7px;
      height: 7px;
      background: var(--accent);
      border-radius: 50%;
      animation: pulse 1.8s ease infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.75); }
    }

    .hero-headline {
      font-size: clamp(2.6rem, 6vw, 5rem);
      font-weight: 800;
      line-height: 1.08;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      margin-bottom: 24px;
      animation: fadeUp 0.7s 0.1s ease both;
    }

    .hero-headline .accent-word {
      color: var(--accent);
      position: relative;
    }

    .hero-headline .outline-word {
      -webkit-text-stroke: 1.5px rgba(255,255,255,0.25);
      color: transparent;
    }

    .hero-sub {
      font-size: 1.15rem;
      color: var(--text-muted);
      line-height: 1.75;
      max-width: 540px;
      margin-bottom: 40px;
      animation: fadeUp 0.7s 0.2s ease both;
    }

    .hero-actions {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      animation: fadeUp 0.7s 0.3s ease both;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--accent);
      color: #080C14;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 15px 30px;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px var(--accent-glow);
    }

    .btn-ghost {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: transparent;
      color: var(--text-primary);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 15px 28px;
      border-radius: 50px;
      border: 1px solid var(--border);
      cursor: pointer;
      text-decoration: none;
      transition: border-color 0.2s, background 0.2s;
    }

    .btn-ghost:hover {
      border-color: rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.04);
    }

    .hero-stats {
      display: flex;
      align-items: center;
      gap: 40px;
      margin-top: 64px;
      flex-wrap: wrap;
      animation: fadeUp 0.7s 0.4s ease both;
    }

    .hero-stat-divider {
      width: 1px;
      height: 40px;
      background: var(--border);
    }

    .hero-stat-num {
      font-size: 2rem;
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1;
    }

    .hero-stat-num span {
      color: var(--accent);
    }

    .hero-stat-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 4px;
      font-weight: 500;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* =============================================
       ABOUT SECTION
    ============================================= */
    #about {
      padding: 100px 0;
    }

    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 64px;
      align-items: center;
    }

    .about-visual {
      position: relative;
    }

    .about-card-main {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
      position: relative;
      overflow: hidden;
    }

    .about-card-main::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }

    .about-card-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }

    .about-card-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .about-card-row:first-child {
      padding-top: 0;
    }

    .about-icon-box {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: var(--accent-dim);
      display: grid;
      place-items: center;
      flex-shrink: 0;
      font-size: 1.1rem;
    }

    .about-row-label {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .about-row-val {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .about-float-badge {
      position: absolute;
      bottom: -20px;
      right: -20px;
      background: var(--accent);
      color: #080C14;
      padding: 14px 20px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 1.4rem;
      line-height: 1.1;
      text-align: center;
      box-shadow: 0 16px 40px rgba(62, 232, 181, 0.35);
    }

    .about-float-badge small {
      display: block;
      font-size: 0.7rem;
      font-weight: 600;
      opacity: 0.7;
    }

    .about-text {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .about-body {
      font-size: 1rem;
      color: var(--text-muted);
      line-height: 1.8;
    }

    .about-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 8px;
    }

    .pill {
      background: var(--bg-card2);
      border: 1px solid var(--border);
      color: var(--text-primary);
      font-size: 0.82rem;
      font-weight: 600;
      padding: 7px 15px;
      border-radius: 50px;
    }

    /* =============================================
       SERVICES SECTION
    ============================================= */
    #services {
      padding: 100px 0;
      background: linear-gradient(180deg, transparent 0%, rgba(62, 232, 181, 0.03) 50%, transparent 100%);
    }

    .services-header {
      text-align: center;
      margin-bottom: 60px;
    }

    .services-header .section-subtitle {
      margin: 0 auto;
    }

    .services-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    .service-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
      position: relative;
      overflow: hidden;
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
      cursor: default;
    }

    .service-card::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: var(--radius);
      background: radial-gradient(circle at 50% 0%, rgba(62, 232, 181, 0.07) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .service-card:hover {
      transform: translateY(-6px);
      border-color: rgba(62, 232, 181, 0.25);
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    }

    .service-card:hover::after {
      opacity: 1;
    }

    .service-card.featured {
      border-color: rgba(62, 232, 181, 0.35);
      background: linear-gradient(135deg, var(--bg-card2) 0%, rgba(62, 232, 181, 0.05) 100%);
    }

    .service-featured-tag {
      position: absolute;
      top: 16px;
      right: 16px;
      background: var(--accent);
      color: #080C14;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 50px;
    }

    .service-icon {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: var(--accent-dim);
      border: 1px solid rgba(62, 232, 181, 0.2);
      display: grid;
      place-items: center;
      font-size: 1.4rem;
      margin-bottom: 22px;
    }

    .service-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 10px;
    }

    .service-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.7;
      margin-bottom: 22px;
    }

    .service-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .service-tag {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-dim);
      padding: 4px 10px;
      border-radius: 50px;
    }

    /* =============================================
       WHY US SECTION
    ============================================= */
    #whyus {
      padding: 100px 0;
    }

    .whyus-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 64px;
      align-items: center;
    }

    .whyus-list {
      display: flex;
      flex-direction: column;
      gap: 24px;
      margin-top: 32px;
    }

    .whyus-item {
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }

    .whyus-check {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--accent-dim);
      border: 1px solid rgba(62, 232, 181, 0.3);
      display: grid;
      place-items: center;
      flex-shrink: 0;
      color: var(--accent);
      font-size: 1rem;
    }

    .whyus-item-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .whyus-item-desc {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.65;
    }

    .whyus-visual {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .metric-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 24px;
      text-align: center;
      transition: border-color 0.25s, transform 0.25s;
    }

    .metric-card:hover {
      border-color: rgba(62, 232, 181, 0.25);
      transform: translateY(-4px);
    }

    .metric-card.tall {
      grid-row: span 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .metric-num {
      font-size: 2.4rem;
      font-weight: 800;
      color: var(--accent);
      line-height: 1;
      margin-bottom: 6px;
    }

    .metric-label {
      font-size: 0.82rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* =============================================
       CONTACT SECTION
    ============================================= */
    #contact {
      padding: 100px 0 120px;
    }

    .contact-wrap {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 24px;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr 1.2fr;
    }

    .contact-left {
      background: linear-gradient(135deg, #0A1520 0%, #0F1D2E 100%);
      padding: 56px 48px;
      position: relative;
      overflow: hidden;
    }

    .contact-left::before {
      content: '';
      position: absolute;
      bottom: -80px;
      left: -80px;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(62, 232, 181, 0.1) 0%, transparent 70%);
    }

    .contact-left-title {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1.2;
      margin-bottom: 16px;
      position: relative;
    }

    .contact-left-title span {
      color: var(--accent);
    }

    .contact-left-desc {
      font-size: 0.92rem;
      color: var(--text-muted);
      line-height: 1.7;
      margin-bottom: 40px;
      position: relative;
    }

    .contact-info-item {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
      position: relative;
    }

    .contact-info-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: var(--accent-dim);
      border:
